<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t   { font-size:20px; font-weight:700; fill:#0f172a; }
      .s   { font-size:12.5px; fill:#475569; }
      .num { font-size:15px; font-weight:800; fill:#ffffff; }
      .ph  { font-size:12.5px; font-weight:700; fill:#0f172a; }
      .sub { font-size:10.5px; fill:#475569; }
      .band{ font-size:11px; font-weight:700; }
    </style>
  </defs>
  <rect x="0" y="0" width="940" height="360" fill="#f8fafc" rx="16"/>
  <text x="30" y="42" class="t">Migration at a glance — seven phases</text>
  <text x="30" y="64" class="s">Do them in order. Everything up to the domain switch can be prepared safely; the domain + email cutover is the one live, careful step.</text>

  <!-- phase bands -->
  <rect x="30" y="92" width="470" height="26" rx="8" fill="#dcfce7"/>
  <text x="52" y="110" class="band" fill="#166534">✓ Prepare safely — no effect on the live Wix shop</text>
  <rect x="512" y="92" width="230" height="26" rx="8" fill="#fee2e2"/>
  <text x="530" y="110" class="band" fill="#991b1b">⚠ Live cutover — plan the timing</text>
  <rect x="754" y="92" width="156" height="26" rx="8" fill="#e0e7ff"/>
  <text x="772" y="110" class="band" fill="#3730a3">Finish up</text>

  <!-- connector line -->
  <line x1="80" y1="175" x2="880" y2="175" stroke="#cbd5e1" stroke-width="2" marker-end="url(#mg)"/>

  <!-- nodes: 7 phases, x from ~80 to ~880 -->
  <!-- 1 -->
  <circle cx="80" cy="175" r="19" fill="#16a34a"/><text x="74" y="181" class="num">1</text>
  <text x="80" y="215" class="ph" text-anchor="middle">Cloudflare</text>
  <text x="80" y="230" class="sub" text-anchor="middle">account</text>
  <!-- 2 -->
  <circle cx="213" cy="175" r="19" fill="#16a34a"/><text x="207" y="181" class="num">2</text>
  <text x="213" y="215" class="ph" text-anchor="middle">Provision</text>
  <text x="213" y="230" class="sub" text-anchor="middle">D1 · R2 · Access</text>
  <!-- 3 -->
  <circle cx="346" cy="175" r="19" fill="#16a34a"/><text x="340" y="181" class="num">3</text>
  <text x="346" y="215" class="ph" text-anchor="middle">Migrate data</text>
  <text x="346" y="230" class="sub" text-anchor="middle">catalog · orders</text>
  <!-- 4 -->
  <circle cx="479" cy="175" r="19" fill="#16a34a"/><text x="473" y="181" class="num">4</text>
  <text x="479" y="215" class="ph" text-anchor="middle">Stripe</text>
  <text x="479" y="230" class="sub" text-anchor="middle">handoff</text>
  <!-- 5 -->
  <circle cx="612" cy="175" r="19" fill="#dc2626"/><text x="606" y="181" class="num">5</text>
  <text x="612" y="215" class="ph" text-anchor="middle" fill="#991b1b">Domain + email</text>
  <text x="612" y="230" class="sub" text-anchor="middle">DNS switch</text>
  <!-- 6 -->
  <circle cx="712" cy="175" r="19" fill="#dc2626"/><text x="706" y="181" class="num">6</text>
  <text x="712" y="215" class="ph" text-anchor="middle" fill="#991b1b">Cutover</text>
  <text x="712" y="230" class="sub" text-anchor="middle">test &amp; verify</text>
  <!-- 7 -->
  <circle cx="832" cy="175" r="19" fill="#4f46e5"/><text x="826" y="181" class="num">7</text>
  <text x="832" y="215" class="ph" text-anchor="middle">Decommission</text>
  <text x="832" y="230" class="sub" text-anchor="middle">cancel Wix</text>

  <!-- footnote -->
  <rect x="30" y="278" width="880" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <text x="52" y="304" class="ph" font-size="13">The golden rule</text>
  <text x="52" y="324" class="s">Keep the Wix shop live until the new site is fully tested on the real domain — then, and only then, cancel Wix. Never delete anything at Wix before the switch is confirmed working.</text>
</svg>
