    <text class="num" x="805" y="118" text-anchor="middle">6</text>
    <text class="ph" x="822" y="118">Send</text>
    <text class="sub" x="798" y="140">order emails</text>
  </g>
  <path d="M920 127 H932 V173 H8 V219 H16"
        fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mg)"/>

  <g>
    <rect x="20" y="188" width="132" height="62" rx="8"
