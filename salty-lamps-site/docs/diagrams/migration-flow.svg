    <text class="ph" x="54" y="302">Dashboards</text>
    <text class="sub" x="30" y="324">tell the truth</text>
  </g>
  <line x1="152" y1="311" x2="169.6" y2="311" stroke="#64748b" stroke-width="1.3" marker-end="url(#mg)"/>

  <g>
    <rect x="173.6" y="280" width="132" height="62" rx="8"
          fill="#ffffff" stroke="#d88a35" stroke-width="1.4"/>
    <circle cx="190.6" cy="298" r="11" fill="#d88a35"/>
    <text class="num" x="190.6" y="302" text-anchor="middle">14</text>
    <text class="ph" x="207.6" y="302">Search</text>
    <text class="sub" x="183.6" y="324">prove it first</text>
  </g>
  <line x1="305.6" y1="311" x2="323.2" y2="311" stroke="#64748b" stroke-width="1.3" marker-end="url(#mg)"/>

  <g>
    <rect x="327.2" y="280" width="132" height="62" rx="8"
