    <circle cx="37" cy="206" r="11" fill="#2d7b5f"/>
    <text class="num" x="37" y="210" text-anchor="middle">7</text>
    <text class="ph" x="54" y="210">Build</text>
    <text class="sub" x="30" y="232">the new shop</text>
  </g>
  <line x1="152" y1="219" x2="169.6" y2="219" stroke="#64748b" stroke-width="1.3" marker-end="url(#mg)"/>

  <g>
    <rect x="173.6" y="188" width="132" height="62" rx="8"
