    <circle cx="344.2" cy="114" r="11" fill="#2d7b5f"/>
    <text class="num" x="344.2" y="118" text-anchor="middle">3</text>
    <text class="ph" x="361.2" y="118">Cloudflare</text>
    <text class="sub" x="337.2" y="140">owner's account</text>
  </g>
  <line x1="459.2" y1="127" x2="476.79999999999995" y2="127" stroke="#64748b" stroke-width="1.3" marker-end="url(#mg)"/>

  <g>
    <rect x="480.79999999999995" y="96" width="132" height="62" rx="8"
