    <circle cx="651.4" cy="114" r="11" fill="#d88a35"/>
    <text class="num" x="651.4" y="118" text-anchor="middle">5</text>
    <text class="ph" x="668.4" y="118">Receive</text>
    <text class="sub" x="644.4" y="140">email forwarding</text>
  </g>
  <line x1="766.4" y1="127" x2="784" y2="127" stroke="#64748b" stroke-width="1.3" marker-end="url(#mg)"/>

