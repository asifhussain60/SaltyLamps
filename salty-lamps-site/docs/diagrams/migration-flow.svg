    <circle cx="190.6" cy="206" r="11" fill="#d88a35"/>
    <text class="num" x="190.6" y="210" text-anchor="middle">8</text>
    <text class="ph" x="207.6" y="210">Catalogue</text>
    <text class="sub" x="183.6" y="232">today's prices</text>
  </g>
  <line x1="305.6" y1="219" x2="323.2" y2="219" stroke="#64748b" stroke-width="1.3" marker-end="url(#mg)"/>

  <g>
    <rect x="327.2" y="188" width="132" height="62" rx="8"
          fill="#ffffff" stroke="#d88a35" stroke-width="1.4"/>
    <circle cx="344.2" cy="206" r="11" fill="#d88a35"/>
    <text class="num" x="344.2" y="210" text-anchor="middle">9</text>
    <text class="ph" x="361.2" y="210">Admin</text>
    <text class="sub" x="337.2" y="232">own subdomain</text>
  </g>
  <line x1="459.2" y1="219" x2="476.79999999999995" y2="219" stroke="#64748b" stroke-width="1.3" marker-end="url(#mg)"/>

