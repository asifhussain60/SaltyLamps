<svg xmlns="http://www.w3.org/2000/svg" width="940" height="428" viewBox="0 0 940 428" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t   { font-size:20px; font-weight:700; fill:#0f172a; }
      .s   { font-size:12.5px; fill:#475569; }
      .num { font-size:13px; font-weight:800; fill:#ffffff; }
      .ph  { font-size:12.5px; font-weight:700; fill:#0f172a; }
      .sub { font-size:10px; fill:#475569; }
      .band{ font-size:11px; font-weight:700; fill:#475569; }
    </style>
  </defs>
  <rect width="940" height="428" fill="#ffffff"/>
  <text class="t" x="20" y="34">Wix to Cloudflare, in seventeen phases</text>
  <text class="s" x="20" y="56">Nothing a customer can see changes until phase 15. Everything before it can be undone.</text>
  <text class="s" x="20" y="76">Green: nothing to break.  Amber: reversible, but think.  Red: the public switch.</text>

  <g>
    <rect x="20" y="96" width="132" height="62" rx="8"
          fill="#ffffff" stroke="#2d7b5f" stroke-width="1.4"/>
    <circle cx="37" cy="114" r="11" fill="#2d7b5f"/>
    <text class="num" x="37" y="118" text-anchor="middle">1</text>
    <text class="ph" x="54" y="118">Gather</text>
    <text class="sub" x="30" y="140">what you need</text>
  </g>
  <line x1="152" y1="127" x2="169.6" y2="127" stroke="#64748b" stroke-width="1.3" marker-end="url(#mg)"/>

  <g>
    <rect x="173.6" y="96" width="132" height="62" rx="8"
          fill="#ffffff" stroke="#2d7b5f" stroke-width="1.4"/>
    <circle cx="190.6" cy="114" r="11" fill="#2d7b5f"/>
    <text class="num" x="190.6" y="118" text-anchor="middle">2</text>
    <text class="ph" x="207.6" y="118">Back up</text>
    <text class="sub" x="183.6" y="140">Wix + this shop</text>
