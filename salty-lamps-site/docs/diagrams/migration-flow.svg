  <text class="band" x="20" y="402">Phases 1&#8211;14 run alongside the live Wix shop &#8212; it stays up and untouched throughout.</text>
  <text class="band" x="20" y="418" fill="#9b4328">Phase 15 is the only step a customer can see. Phase 17 is the only one that cannot be undone.</text>
  <rect x="322.2" y="275" width="142" height="72" rx="11" fill="none" stroke="#9b4328" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
