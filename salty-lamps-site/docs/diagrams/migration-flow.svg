  <line x1="766.4" y1="219" x2="784" y2="219" stroke="#64748b" stroke-width="1.3" marker-end="url(#mg)"/>

  <g>
    <rect x="788" y="188" width="132" height="62" rx="8"
          fill="#ffffff" stroke="#d88a35" stroke-width="1.4"/>
    <circle cx="805" cy="206" r="11" fill="#d88a35"/>
