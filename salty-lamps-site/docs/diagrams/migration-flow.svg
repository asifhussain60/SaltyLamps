  <line x1="612.8" y1="311" x2="630.4" y2="311" stroke="#64748b" stroke-width="1.3" marker-end="url(#mg)"/>

  <g>
    <rect x="634.4" y="280" width="132" height="62" rx="8"
          fill="#ffffff" stroke="#d88a35" stroke-width="1.4"/>
    <circle cx="651.4" cy="298" r="11" fill="#d88a35"/>
    <text class="num" x="651.4" y="302" text-anchor="middle">17</text>
    <text class="ph" x="668.4" y="302">Close Wix</text>
    <text class="sub" x="644.4" y="324">after two weeks</text>
