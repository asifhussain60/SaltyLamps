    <rect x="480.79999999999995" y="188" width="132" height="62" rx="8"
          fill="#ffffff" stroke="#d88a35" stroke-width="1.4"/>
    <circle cx="497.79999999999995" cy="206" r="11" fill="#d88a35"/>
    <text class="num" x="497.79999999999995" y="210" text-anchor="middle">10</text>
    <text class="ph" x="514.8" y="210">Payments</text>
    <text class="sub" x="490.79999999999995" y="232">one real order</text>
  </g>
  <line x1="612.8" y1="219" x2="630.4" y2="219" stroke="#64748b" stroke-width="1.3" marker-end="url(#mg)"/>

