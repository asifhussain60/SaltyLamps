    <circle cx="497.79999999999995" cy="114" r="11" fill="#d88a35"/>
    <text class="num" x="497.79999999999995" y="118" text-anchor="middle">4</text>
    <text class="ph" x="514.8" y="118">Domain</text>
    <text class="sub" x="490.79999999999995" y="140">to Cloudflare</text>
  </g>
  <line x1="612.8" y1="127" x2="630.4" y2="127" stroke="#64748b" stroke-width="1.3" marker-end="url(#mg)"/>

  <g>
    <rect x="634.4" y="96" width="132" height="62" rx="8"
