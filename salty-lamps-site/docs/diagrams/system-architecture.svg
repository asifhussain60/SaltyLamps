<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .panel   { fill:#ffffff; stroke:#e2e8f0; stroke-width:1.5; rx:14; }
      .title   { font-size:15px; font-weight:700; fill:#0f172a; }
      .sub     { font-size:11.5px; fill:#475569; }
      .chip    { rx:10; }
      .chipTxt { font-size:12.5px; font-weight:600; }
      .lbl     { font-size:11px; fill:#475569; }
      .edge    { stroke:#94a3b8; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .edgeDash{ stroke:#94a3b8; stroke-width:1.6; fill:none; stroke-dasharray:4 4; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="940" height="600" fill="#f8fafc" rx="16"/>
  <text x="30" y="42" class="title" font-size="20">Salty Lamps — how the site is hosted</text>
  <text x="30" y="64" class="sub" font-size="12.5">Everything runs on Cloudflare. The browser talks only to Cloudflare Pages; the behind-the-scenes functions talk to the database, image store, and Stripe.</text>

  <!-- Actors -->
  <g>
    <rect x="30" y="120" width="170" height="90" class="panel"/>
    <text x="48" y="152" class="title">🛍️ Shopper</text>
    <text x="48" y="174" class="sub">Browses products,</text>
    <text x="48" y="190" class="sub">adds to cart, pays.</text>
  </g>
  <g>
    <rect x="30" y="360" width="170" height="90" class="panel"/>
    <text x="48" y="392" class="title">🔑 Admin</text>
    <text x="48" y="414" class="sub">Manages catalog,</text>
    <text x="48" y="430" class="sub">stock and orders.</text>
  </g>

  <!-- Cloudflare Pages -->
  <rect x="300" y="95" width="300" height="410" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" rx="16"/>
  <text x="320" y="126" class="title" fill="#c2410c">☁️ Cloudflare Pages</text>
  <text x="320" y="146" class="sub" fill="#9a3412">The public website + its API, one deploy</text>

  <rect x="322" y="165" width="256" height="120" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" rx="12"/>
  <text x="340" y="192" class="title" font-size="13.5">Static website</text>
  <text x="340" y="214" class="sub">React + Vite build (the pages,</text>
  <text x="340" y="230" class="sub">product listings, cart UI, admin UI).</text>
  <text x="340" y="252" class="sub">Served from Cloudflare's global edge.</text>

  <rect x="322" y="300" width="256" height="185" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" rx="12"/>
  <text x="340" y="327" class="title" font-size="13.5">Pages Functions  (/api/*)</text>
  <text x="340" y="349" class="sub">Small server functions that run on</text>
  <text x="340" y="365" class="sub">request: product feed, checkout,</text>
  <text x="340" y="381" class="sub">payment webhook, image serving,</text>
  <text x="340" y="397" class="sub">and the whole admin API.</text>
  <rect x="340" y="415" width="100" height="26" fill="#fef3c7" class="chip"/>
  <text x="352" y="432" class="chipTxt" fill="#92400e">/api/products</text>
  <rect x="446" y="415" width="96" height="26" fill="#fef3c7" class="chip"/>
  <text x="458" y="432" class="chipTxt" fill="#92400e">/api/checkout</text>
  <rect x="340" y="449" width="120" height="26" fill="#fee2e2" class="chip"/>
  <text x="352" y="466" class="chipTxt" fill="#991b1b">/api/admin/*  🔒</text>

  <!-- Services on the right -->
  <g>
    <rect x="700" y="110" width="210" height="72" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="12"/>
    <text x="718" y="140" class="title" fill="#1d4ed8">🗄️ D1 database</text>
    <text x="718" y="162" class="sub">Products, stock, orders</text>
  </g>
  <g>
    <rect x="700" y="200" width="210" height="72" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" rx="12"/>
    <text x="718" y="230" class="title" fill="#047857">🖼️ R2 storage</text>
    <text x="718" y="252" class="sub">Uploaded product images</text>
  </g>
  <g>
    <rect x="700" y="290" width="210" height="72" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5" rx="12"/>
    <text x="718" y="320" class="title" fill="#4338ca">💳 Stripe</text>
    <text x="718" y="342" class="sub">Card payments &amp; checkout</text>
  </g>
  <g>
    <rect x="700" y="380" width="210" height="72" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" rx="12"/>
    <text x="718" y="410" class="title" fill="#b91c1c">🛡️ Cloudflare Access</text>
    <text x="718" y="432" class="sub">Locks the admin area</text>
  </g>

  <!-- Edges -->
  <path class="edge" d="M200 160 C 250 160, 255 200, 300 210"/>
  <text x="212" y="150" class="lbl">views / buys</text>
  <path class="edgeDash" d="M200 400 C 250 400, 255 420, 300 430"/>
  <text x="210" y="392" class="lbl">signs in</text>

  <path class="edge" d="M600 210 C 660 210, 650 150, 700 146"/>
  <path class="edge" d="M600 360 C 660 360, 660 250, 700 236"/>
  <path class="edge" d="M600 400 C 655 400, 660 330, 700 326"/>
  <path class="edgeDash" d="M600 462 C 655 462, 660 430, 700 416"/>

  <text x="30" y="560" class="sub" font-size="11">Dashed lines = admin-only paths, gated by Cloudflare Access. Solid lines = public shopper paths.</text>
</svg>
