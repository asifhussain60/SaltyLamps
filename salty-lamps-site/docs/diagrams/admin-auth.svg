<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .t   { font-size:20px; font-weight:700; fill:#0f172a; }
      .s   { font-size:12.5px; fill:#475569; }
      .box { rx:12; stroke-width:1.5; }
      .bt  { font-size:13px; font-weight:700; fill:#0f172a; }
      .bs  { font-size:11px; fill:#475569; }
      .flow{ stroke:#b91c1c; stroke-width:1.8; fill:none; marker-end:url(#arr3); }
      .lbl { font-size:11px; fill:#7f1d1d; font-weight:600; }
      .ok  { fill:#047857; font-weight:700; font-size:11px; }
      .no  { fill:#b91c1c; font-weight:700; font-size:11px; }
    </style>
  </defs>
  <rect x="0" y="0" width="940" height="600" fill="#f8fafc" rx="16"/>
  <text x="30" y="42" class="t">Who is allowed into the admin area</text>
  <text x="30" y="64" class="s">Cloudflare Access checks identity before any admin page loads; the site then re-verifies the signed pass on every admin request.</text>

  <!-- 1 admin -->
  <rect x="40" y="120" width="180" height="80" fill="#fff7ed" stroke="#fdba74" class="box"/>
  <text x="58" y="150" class="bt">🔑 Admin visits</text>
  <text x="58" y="170" class="bs">/admin on the live site</text>

  <!-- 2 access gate -->
  <rect x="290" y="105" width="220" height="110" fill="#fef2f2" stroke="#fca5a5" class="box"/>
  <text x="308" y="134" class="bt" fill="#b91c1c">🛡️ Cloudflare Access</text>
  <text x="308" y="156" class="bs">Requires sign-in (email</text>
  <text x="308" y="172" class="bs">one-time code or company</text>
  <text x="308" y="188" class="bs">login). Issues a signed</text>
  <text x="308" y="204" class="bs">pass (JWT) when allowed.</text>

  <!-- 3 middleware -->
  <rect x="580" y="105" width="320" height="150" fill="#ffffff" stroke="#cbd5e1" class="box"/>
  <text x="600" y="134" class="bt">🧩 Admin API middleware</text>
  <text x="600" y="154" class="bs">functions/api/admin/_middleware.js — runs</text>
  <text x="600" y="170" class="bs">on every /api/admin/* request:</text>
  <text x="600" y="192" class="bs">• fetches the team's public keys (JWKS)</text>
  <text x="600" y="208" class="bs">• verifies the pass signature + audience (AUD)</text>
  <text x="600" y="224" class="bs">• reads the signed-in email from it</text>
  <text x="600" y="244" class="bs">Needs secrets: ACCESS_AUD, ACCESS_TEAM_DOMAIN</text>

  <!-- outcomes -->
  <rect x="580" y="300" width="200" height="86" fill="#ecfdf5" stroke="#6ee7b7" class="box"/>
  <text x="598" y="328" class="bt" fill="#047857">✓ Valid pass</text>
  <text x="598" y="350" class="bs">Request proceeds. The email</text>
  <text x="598" y="366" class="bs">is logged in admin_audit for</text>
  <text x="598" y="381" class="bs">every change made.</text>

  <rect x="800" y="300" width="100" height="86" fill="#fef2f2" stroke="#fca5a5" class="box"/>
  <text x="818" y="328" class="bt" fill="#b91c1c">✗ No / bad</text>
  <text x="818" y="348" class="bs">pass → 401.</text>
  <text x="818" y="366" class="bs">Not set up</text>
  <text x="818" y="381" class="bs">→ 503.</text>

  <!-- dev bypass -->
  <rect x="40" y="430" width="860" height="120" fill="#fffbeb" stroke="#fcd34d" class="box"/>
  <text x="60" y="460" class="bt" fill="#b45309">⚙️ Developer / UAT shortcut — DEV_ADMIN_BYPASS</text>
  <text x="60" y="484" class="bs">When the secret DEV_ADMIN_BYPASS=1 is set, the middleware skips all the checks above and treats the caller as “dev@localhost”.</text>
  <text x="60" y="504" class="bs">This is how local development and the current DEV/UAT site let you into the admin without Cloudflare Access configured.</text>
  <text x="60" y="528" class="no">Must NEVER be set on the real production (owner) site — it would leave the admin open to anyone with the URL.</text>

  <!-- flows -->
  <path class="flow" d="M220 160 L290 160"/>
  <path class="flow" d="M510 160 L580 165"/>
  <text x="230" y="150" class="lbl">visit</text>
  <text x="520" y="150" class="lbl">with pass</text>
  <path class="flow" d="M690 255 L680 300"/>
  <path class="flow" d="M820 255 C 850 270, 850 285, 850 300"/>
</svg>
