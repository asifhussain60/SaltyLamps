<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .t  { font-size:20px; font-weight:700; fill:#0f172a; }
    .s  { font-size:12.5px; fill:#475569; }
    .h  { font-size:16px; font-weight:800; }
    .big{ font-size:30px; font-weight:800; }
    .lbl{ font-size:12.5px; fill:#334155; }
    .note{ font-size:12px; fill:#475569; }
  </style>
  <rect x="0" y="0" width="940" height="470" fill="#f8fafc" rx="16"/>
  <text x="30" y="42" class="t">What it costs to run the live shop</text>
  <text x="30" y="64" class="s">Two bills to think about: hosting (Cloudflare) and card payments (Stripe). One is basically free; the other is a small cut per sale.</text>

  <!-- Cloudflare panel -->
  <rect x="30" y="92" width="420" height="240" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" rx="14"/>
  <text x="52" y="128" class="h" fill="#c2410c">☁️ Cloudflare — hosting</text>
  <text x="52" y="150" class="s" fill="#9a3412">Website, database, and image storage</text>
  <text x="52" y="205" class="big" fill="#c2410c">≈ £0 / month</text>
  <text x="52" y="232" class="lbl">for a shop this size — it sits inside the</text>
  <text x="52" y="250" class="lbl">free tiers for hosting, database and images.</text>
  <text x="52" y="286" class="note">You'd only start paying if the shop gets very</text>
  <text x="52" y="303" class="note">busy; the paid plan then starts at about $5/mo.</text>

  <!-- Stripe panel -->
  <rect x="490" y="92" width="420" height="240" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5" rx="14"/>
  <text x="512" y="128" class="h" fill="#4338ca">💳 Stripe — card payments</text>
  <text x="512" y="150" class="s" fill="#3730a3">Taking money at checkout</text>
  <text x="512" y="205" class="big" fill="#4338ca">No monthly fee</text>
  <text x="512" y="232" class="lbl">Instead, Stripe keeps a small cut of each sale.</text>
  <rect x="512" y="255" width="360" height="52" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" rx="10"/>
  <text x="530" y="285" class="h" fill="#4338ca" font-size="18">1.5% + 20p</text>
  <text x="640" y="280" class="note">per payment on a UK card</text>
  <text x="640" y="297" class="note">(more for overseas cards — see next graphic)</text>

  <!-- domain footer -->
  <rect x="30" y="352" width="880" height="86" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <text x="52" y="386" class="h" font-size="15" fill="#0f172a">🌐 One more small cost — your domain name</text>
  <text x="52" y="410" class="s">A .co.uk web address is a small yearly fee (roughly £8–£12/year). Moving saltylamps.co.uk from Wix to Cloudflare is free —</text>
  <text x="52" y="428" class="s">.uk transfers cost nothing — so you only keep paying the small yearly renewal.</text>
</svg>
