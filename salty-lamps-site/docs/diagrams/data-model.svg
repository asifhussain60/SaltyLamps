<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="one" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M6 0 V12" stroke="#64748b" stroke-width="1.6"/>
    </marker>
    <marker id="many" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M12 1 L1 7 L12 13" fill="none" stroke="#64748b" stroke-width="1.6"/>
    </marker>
    <style>
      .t   { font-size:20px; font-weight:700; fill:#0f172a; }
      .s   { font-size:12.5px; fill:#475569; }
      .ent { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:12; }
      .hd  { font-size:14px; font-weight:800; fill:#ffffff; }
      .col { font-size:11.5px; fill:#334155; }
      .pk  { font-weight:700; fill:#0f172a; }
      .fk  { fill:#2563eb; }
      .rel { stroke:#64748b; stroke-width:1.6; fill:none; marker-start:url(#one); marker-end:url(#many); }
      .relLbl{ font-size:10.5px; fill:#64748b; }
    </style>
  </defs>
  <rect x="0" y="0" width="940" height="620" fill="#f8fafc" rx="16"/>
  <text x="30" y="42" class="t">Database structure (Cloudflare D1)</text>
  <text x="30" y="64" class="s">Five tables. A product has many sizes/variants (SKUs); an order has many line items, each pointing at one SKU.</text>

  <!-- products -->
  <g>
    <rect x="40" y="100" width="240" height="150" class="ent"/>
    <rect x="40" y="100" width="240" height="30" fill="#1d4ed8" rx="12"/>
    <rect x="40" y="118" width="240" height="12" fill="#1d4ed8"/>
    <text x="56" y="121" class="hd">products</text>
    <text x="56" y="150" class="col pk">🔑 id  (product handle)</text>
    <text x="56" y="170" class="col">name, slug, description</text>
    <text x="56" y="190" class="col">image  (/media or /api/images)</text>
    <text x="56" y="210" class="col">categories, tags</text>
    <text x="56" y="230" class="col">visible</text>
  </g>

  <!-- skus -->
  <g>
    <rect x="40" y="330" width="240" height="170" class="ent"/>
    <rect x="40" y="330" width="240" height="30" fill="#1d4ed8" rx="12"/>
    <rect x="40" y="348" width="240" height="12" fill="#1d4ed8"/>
    <text x="56" y="351" class="hd">skus</text>
    <text x="56" y="380" class="col pk">🔑 id  (auto number)</text>
    <text x="56" y="400" class="col">sku  (code, not unique in source)</text>
    <text x="56" y="420" class="col fk">↳ product_id → products.id</text>
    <text x="56" y="440" class="col">variant_label, price_pence</text>
    <text x="56" y="460" class="col">track_mode (quantity | binary)</text>
    <text x="56" y="480" class="col">quantity, in_stock</text>
  </g>

  <!-- order_items -->
  <g>
    <rect x="360" y="330" width="240" height="140" class="ent"/>
    <rect x="360" y="330" width="240" height="30" fill="#047857" rx="12"/>
    <rect x="360" y="348" width="240" height="12" fill="#047857"/>
    <text x="376" y="351" class="hd">order_items</text>
    <text x="376" y="380" class="col pk">🔑 (order_id + sku_id)</text>
    <text x="376" y="400" class="col fk">↳ order_id → orders.id</text>
    <text x="376" y="420" class="col fk">↳ sku_id → skus.id</text>
    <text x="376" y="440" class="col">quantity</text>
    <text x="376" y="460" class="col">unit_price_pence  (snapshot)</text>
  </g>

  <!-- orders -->
  <g>
    <rect x="680" y="100" width="240" height="230" class="ent"/>
    <rect x="680" y="100" width="240" height="30" fill="#047857" rx="12"/>
    <rect x="680" y="118" width="240" height="12" fill="#047857"/>
    <text x="696" y="121" class="hd">orders</text>
    <text x="696" y="150" class="col pk">🔑 id  (Stripe session id)</text>
    <text x="696" y="170" class="col">payment_intent, status</text>
    <text x="696" y="190" class="col">customer_email</text>
    <text x="696" y="210" class="col">amount_total_pence, currency</text>
    <text x="696" y="230" class="col">created_at</text>
    <text x="696" y="250" class="col">fulfilment_status</text>
    <text x="696" y="270" class="col">tracking_number, shipped_at</text>
    <text x="696" y="290" class="col">ship_name / line1 / line2 /</text>
    <text x="696" y="310" class="col">city / postcode / country</text>
  </g>

  <!-- admin_audit -->
  <g>
    <rect x="680" y="390" width="240" height="130" class="ent"/>
    <rect x="680" y="390" width="240" height="30" fill="#b45309" rx="12"/>
    <rect x="680" y="408" width="240" height="12" fill="#b45309"/>
    <text x="696" y="411" class="hd">admin_audit</text>
    <text x="696" y="440" class="col pk">🔑 id</text>
    <text x="696" y="460" class="col">actor_email, action</text>
    <text x="696" y="480" class="col">entity, entity_id, detail</text>
    <text x="696" y="500" class="col">created_at</text>
    <text x="696" y="527" class="relLbl">Append-only log of every admin write. Standalone.</text>
  </g>

  <!-- relationships -->
  <path class="rel" d="M160 250 L160 330"/>
  <text x="168" y="295" class="relLbl">has many</text>

  <path class="rel" d="M280 415 L360 410"/>
  <text x="292" y="402" class="relLbl">line of</text>

  <path class="rel" d="M600 400 C 660 400, 700 340, 760 330"/>
  <text x="612" y="372" class="relLbl">belongs to order</text>
</svg>
