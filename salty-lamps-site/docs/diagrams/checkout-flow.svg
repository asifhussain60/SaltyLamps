<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .t   { font-size:20px; font-weight:700; fill:#0f172a; }
      .s   { font-size:12.5px; fill:#475569; }
      .lane{ fill:#ffffff; stroke:#e2e8f0; stroke-width:1.5; }
      .laneTxt{ font-size:12.5px; font-weight:700; }
      .step{ rx:12; stroke-width:1.5; }
      .num { font-size:13px; font-weight:800; fill:#ffffff; }
      .stepT{ font-size:12.5px; font-weight:600; fill:#0f172a; }
      .stepS{ font-size:11px; fill:#475569; }
      .flow{ stroke:#6366f1; stroke-width:1.8; fill:none; marker-end:url(#arr2); }
      .fl  { font-size:10.5px; fill:#6366f1; font-weight:600; }
    </style>
  </defs>
  <rect x="0" y="0" width="940" height="640" fill="#f8fafc" rx="16"/>
  <text x="30" y="42" class="t">How a purchase becomes a paid order</text>
  <text x="30" y="64" class="s">The shop never sees card numbers — Stripe takes payment on its own page, then notifies the site to save the order.</text>

  <!-- lanes -->
  <rect x="30" y="95" width="880" height="118" class="lane" rx="12"/>
  <text x="46" y="118" class="laneTxt" fill="#c2410c">🛍️ Shopper's browser</text>
  <rect x="30" y="225" width="880" height="150" class="lane" rx="12"/>
  <text x="46" y="248" class="laneTxt" fill="#9a3412">☁️ Cloudflare Pages Functions</text>
  <rect x="30" y="387" width="880" height="118" class="lane" rx="12"/>
  <text x="46" y="410" class="laneTxt" fill="#4338ca">💳 Stripe (hosted checkout)</text>
  <rect x="30" y="517" width="880" height="98" class="lane" rx="12"/>
  <text x="46" y="540" class="laneTxt" fill="#1d4ed8">🗄️ D1 database</text>

  <!-- 1 -->
  <rect x="60" y="132" width="210" height="66" fill="#fff7ed" stroke="#fdba74" class="step"/>
  <circle cx="82" cy="154" r="12" fill="#f97316"/><text x="77.5" y="159" class="num">1</text>
  <text x="102" y="152" class="stepT">Clicks “Pay”</text>
  <text x="102" y="170" class="stepS">Cart is sent to the site:</text>
  <text x="102" y="185" class="stepS">POST /api/checkout</text>

  <!-- 2 -->
  <rect x="60" y="258" width="240" height="94" fill="#fff1f2" stroke="#fda4af" class="step"/>
  <circle cx="82" cy="282" r="12" fill="#e11d48"/><text x="77.5" y="287" class="num">2</text>
  <text x="102" y="280" class="stepT">checkout.js</text>
  <text x="102" y="298" class="stepS">Re-checks prices &amp; stock in D1,</text>
  <text x="102" y="314" class="stepS">asks Stripe to create a Checkout</text>
  <text x="102" y="330" class="stepS">Session, returns its URL.</text>

  <!-- 3 -->
  <rect x="360" y="414" width="240" height="74" fill="#eef2ff" stroke="#a5b4fc" class="step"/>
  <circle cx="382" cy="438" r="12" fill="#6366f1"/><text x="377.5" y="443" class="num">3</text>
  <text x="402" y="436" class="stepT">Shopper pays on Stripe</text>
  <text x="402" y="454" class="stepS">Card entered on Stripe's own</text>
  <text x="402" y="470" class="stepS">secure page — never on the site.</text>

  <!-- 4 -->
  <rect x="660" y="132" width="230" height="66" fill="#fff7ed" stroke="#fdba74" class="step"/>
  <circle cx="682" cy="154" r="12" fill="#f97316"/><text x="677.5" y="159" class="num">4</text>
  <text x="702" y="152" class="stepT">Back to the shop</text>
  <text x="702" y="170" class="stepS">Stripe redirects to</text>
  <text x="702" y="185" class="stepS">/checkout/success</text>

  <!-- 5 -->
  <rect x="660" y="258" width="230" height="94" fill="#fff1f2" stroke="#fda4af" class="step"/>
  <circle cx="682" cy="282" r="12" fill="#e11d48"/><text x="677.5" y="287" class="num">5</text>
  <text x="702" y="280" class="stepT">webhook.js</text>
  <text x="702" y="298" class="stepS">Stripe notifies the site</text>
  <text x="702" y="314" class="stepS">(checkout.session.completed);</text>
  <text x="702" y="330" class="stepS">signature verified.</text>

  <!-- 6 -->
  <rect x="360" y="540" width="270" height="60" fill="#eff6ff" stroke="#93c5fd" class="step"/>
  <circle cx="382" cy="566" r="12" fill="#3b82f6"/><text x="377.5" y="571" class="num">6</text>
  <text x="402" y="564" class="stepT">Order saved &amp; marked paid</text>
  <text x="402" y="582" class="stepS">orders + order_items written; appears in admin.</text>

  <!-- flows -->
  <path class="flow" d="M165 198 L165 258"/>
  <text x="172" y="232" class="fl">cart</text>
  <path class="flow" d="M300 320 C 340 340, 350 400, 400 424"/>
  <text x="312" y="372" class="fl">create session</text>
  <path class="flow" d="M600 440 C 660 430, 700 260, 730 198"/>
  <text x="642" y="330" class="fl">redirect back</text>
  <path class="flow" d="M600 452 C 700 452, 740 360, 748 352"/>
  <text x="612" y="428" class="fl">notifies (webhook)</text>
  <path class="flow" d="M740 352 C 640 420, 560 500, 500 540"/>
  <text x="600" y="470" class="fl">write order</text>
</svg>
