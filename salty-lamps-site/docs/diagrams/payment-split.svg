<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .t   { font-size:20px; font-weight:700; fill:#0f172a; }
    .s   { font-size:12.5px; fill:#475569; }
    .cardlbl { font-size:13px; font-weight:700; fill:#0f172a; }
    .rate{ font-size:11.5px; fill:#475569; }
    .keep{ font-size:12.5px; font-weight:700; fill:#065f46; }
    .fee { font-size:12.5px; font-weight:700; fill:#991b1b; }
    .leg { font-size:12px; fill:#334155; }
  </style>
  <rect x="0" y="0" width="940" height="500" fill="#f8fafc" rx="16"/>
  <text x="30" y="42" class="t">Where a £30 payment goes</text>
  <text x="30" y="64" class="s">Stripe automatically keeps a small fee — a percentage of the sale plus 20p — and the rest reaches your account.</text>

  <!-- legend -->
  <rect x="600" y="30" width="14" height="14" rx="3" fill="#34d399"/>
  <text x="620" y="42" class="leg">Reaches your account</text>
  <rect x="770" y="30" width="14" height="14" rx="3" fill="#f87171"/>
  <text x="790" y="42" class="leg">Stripe's fee</text>

  <!-- UK card -->
  <text x="30" y="118" class="cardlbl">🇬🇧 UK card</text>
  <text x="30" y="136" class="rate">1.5% + 20p</text>
  <rect x="180" y="98" width="685" height="40" rx="8" fill="#34d399"/>
  <rect x="850" y="98" width="15" height="40" rx="3" fill="#f87171"/>
  <text x="196" y="123" class="keep" fill="#ffffff">You keep £29.35</text>
  <text x="700" y="160" class="fee">fee £0.65</text>

  <!-- European card -->
  <text x="30" y="218" class="cardlbl">🇪🇺 European card</text>
  <text x="30" y="236" class="rate">2.5% + 20p</text>
  <rect x="180" y="198" width="685" height="40" rx="8" fill="#34d399"/>
  <rect x="843" y="198" width="22" height="40" rx="3" fill="#f87171"/>
  <text x="196" y="223" class="keep" fill="#ffffff">You keep £29.05</text>
  <text x="700" y="260" class="fee">fee £0.95</text>

  <!-- International card -->
  <text x="30" y="318" class="cardlbl">🌍 International card</text>
  <text x="30" y="336" class="rate">3.25% + 20p</text>
  <rect x="180" y="298" width="685" height="40" rx="8" fill="#34d399"/>
  <rect x="838" y="298" width="27" height="40" rx="3" fill="#f87171"/>
  <text x="196" y="323" class="keep" fill="#ffffff">You keep £28.82</text>
  <text x="700" y="360" class="fee">fee £1.18</text>

  <!-- footnote -->
  <rect x="30" y="392" width="880" height="82" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <text x="52" y="422" class="cardlbl" font-size="14">In short</text>
  <text x="52" y="446" class="s">On a typical £30 UK sale you keep about £29.35. There's no monthly Stripe fee — you only pay when you actually make a sale.</text>
  <text x="52" y="464" class="s">Overseas cards cost a little more, and a further 2% applies if the payment needs currency conversion.</text>
</svg>
