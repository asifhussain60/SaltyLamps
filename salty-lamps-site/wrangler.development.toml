# Isolated development replica. Never bind the live shop database or image bucket.
name = "salty-lamps-development"
account_id = "e35d5918c507bc2cf4e920fe38b5e318"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "salty-lamps-development-db"
database_id = "62066199-f4b8-4026-8dd2-b56a10cd975d"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "salty-lamps-development-images"

[vars]
DEPLOYMENT_ENV = "development"
STRIPE_TEST_ONLY = "1"
MAIL_DRY_RUN = "true"
SITE_URL = "https://test.saltylamps.co.uk"
PUBLIC_HOST = "www.saltylamps.co.uk"
ADMIN_HOSTS = "test.saltylamps.co.uk"
DEVELOPMENT_SHARED_HOST = "test.saltylamps.co.uk"
ACCESS_AUD = "72d903a62fcd255a453d435e0564c1da117166a099489adb273e4768b0822957"
ACCESS_TEAM_DOMAIN = "steep-voice-d86f.cloudflareaccess.com"
