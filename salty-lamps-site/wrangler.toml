# Local-only placeholder. The former remote proposal account is retired.
# Remote deployment and database commands must use the reviewed owner config.
name = "salty-lamps-local"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# --- Local D1 binding only ---
# This synthetic ID identifies a disposable local database. It does not belong
# to any Cloudflare account. Never use this config with --remote or for deploy.
#
[[d1_databases]]
binding = "DB"
database_name = "salty-lamps-db"
database_id = "00000000-0000-4000-8000-000000000001"

# --- Local simulated R2 binding for admin-uploaded product images ---
# Uploaded images are served publicly at /api/images/<key> (see functions/api/images).
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "salty-lamps-images"

# Local-only credentials belong in gitignored .dev.vars. No Pages secrets are
# managed through this config.
