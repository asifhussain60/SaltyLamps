# Owner-account test deployment only. Never point this at the customer domain,
# production database, Wix archive, or retired Cloudflare account.
name = "salty-lamps-staging"
account_id = "e35d5918c507bc2cf4e920fe38b5e318"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "salty-lamps-staging-db"
database_id = "981a6d7b-8eb7-4057-8023-d2a4894c21e4"

# Cloudflare R2 remains inactive until go-live. Product images in the bundle work;
# administrator uploads return a clear storage-not-configured response.
[vars]
STRIPE_TEST_ONLY = "1"
MAIL_DRY_RUN = "true"
SITE_URL = "https://test.saltylamps.co.uk"
PUBLIC_HOST = "www.saltylamps.co.uk"
ADMIN_HOSTS = "admin.saltylamps.co.uk"
ACCESS_AUD = "72d903a62fcd255a453d435e0564c1da117166a099489adb273e4768b0822957"
ACCESS_TEAM_DOMAIN = "steep-voice-d86f.cloudflareaccess.com"
